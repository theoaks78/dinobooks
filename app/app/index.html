<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced at build time by the value of `flutter build web --base-href`.
    build-web.ps1 passes /dinobooks/app/ so the app sits under the website.
  -->
  <base href="/dinobooks/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DinoBooks: sign in to add and edit books in the library.">
  <meta name="theme-color" content="#22372C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DinoBooks">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DinoBooks</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown until Flutter paints its first frame. The first visit downloads
       the whole app, which takes a few seconds; after that it is cached. */
    html, body { margin: 0; height: 100%; background: #F6F1E3; }
    #dino-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font-family: system-ui, sans-serif; color: #22372C; text-align: center;
      transition: opacity .3s ease;
    }
    #dino-splash img { width: 110px; height: 110px; border-radius: 50%;
      animation: dino-bounce 1.1s infinite ease-in-out; }
    #dino-splash b { font-size: 1.6rem; font-family: Georgia, serif; }
    #dino-splash b span { color: #D8AB16; }
    #dino-splash p { margin: 0; opacity: .7; font-weight: 600; }
    #dino-splash a { color: #5C7A5E; font-weight: 700; font-size: .9rem; }
    @keyframes dino-bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  </style>
</head>
<body>
  <div id="dino-splash">
    <img src="icons/Icon-192.png" alt="">
    <b><span>Dino</span>Books</b>
    <p>The helpful dino is opening the library…</p>
    <a href="../index.html">Just browsing? Back to the website</a>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('dino-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 350);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
